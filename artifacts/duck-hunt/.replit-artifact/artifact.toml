kind = "web"
previewPath = "/"
title = "Duck Hunt — Webcam Edition"
version = "1.0.0"
id = "artifacts/duck-hunt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24342

[services.development]
run = "pnpm --filter @workspace/duck-hunt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/duck-hunt", "run", "build" ]
publicDir = "artifacts/duck-hunt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24342"
BASE_PATH = "/"
